<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>国西Monsters 当日出席簿</title>
<link rel="stylesheet" href="theme.css?v=11">
<meta name="theme-color" content="#070707">
<link rel="icon" href="mark.png">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body class="pg-check">
<header><div class="brand"><img class="mark" src="mark.png" alt=""><div class="wm">KOKUNISHI<b>MONSTERS</b></div></div>
<h1>当日出席簿（当番用）</h1>
  <div class="nv"><button id="pv">◀ 前</button><div class="d" id="dt">読み込み中…</div><button id="nx">次 ▶</button></div>
  <div class="sum"><div id="s1" title="到着した人だけ表示"><b id="c1">-</b>到着</div><div id="s2" title="まだの人だけ表示"><b id="c2">-</b>まだ</div><div id="s3" title="欠席の人だけ表示"><b id="c3">-</b>欠席</div></div>
</header>
<style>
.sum div{cursor:pointer}
.sum div.on{outline:2px solid #ffce1f;outline-offset:-2px;background:#2c2c24}
.fbar{display:none;margin:10px 0 0;font-size:13px;color:#ffce1f}
.fbar b{font-size:15px}
.p.sel{outline:2px solid #ffce1f;outline-offset:-2px;background:#33301e !important}
.p .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #ffce1f;color:#ffce1f;display:none;align-items:center;justify-content:center;font-weight:700}
#list.selmode .p .ck{display:flex}
#list.selmode .p .ab,#list.selmode .p select{display:none}
#selbtn{width:100%;margin:8px 0 0;padding:12px;border:1px solid #55534c;border-radius:12px;background:#1d1d1b;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
#selbar{display:none;margin:10px 0 0;padding:10px;border:1px solid #ffce1f;border-radius:12px;color:#ffce1f;font-size:14px}
#selbar button{padding:10px 14px;border-radius:10px;border:0;font-size:14px;font-weight:700;cursor:pointer}
#selgo{background:#ffce1f;color:#1d1d1b}
#selcancel{background:#2c2c2a;color:#fff;margin-left:8px}
</style>
<nav id="nav"></nav>
<main>
  <div class="card" id="login" style="display:none"><div style="font-size:12px;color:#77756f;margin-bottom:6px">パスコードを入れてください</div><input type="password" id="pass" inputmode="numeric"><button id="go">開く</button></div>
  <div id="plan"></div>
  <p class="help">着いた子の「到着」を押してください（もう一度押すと取り消し）。当日の急な欠席・遅刻・早退は右の欄で変えられます。前もって連絡があった子は、名前の下に表示されます。上の「到着／まだ／欠席」の数字を押すと、その人たちだけを表示できます（もう一度押すと全員に戻ります）。何人かをまとめて欠席にするときは「まとめて選んで欠席にする」から選んでください。</p>
  <p class="fbar" id="fbar"></p>
  <button id="bulk" style="display:none;width:100%;margin:10px 0 0;padding:12px;border:1px solid #ffce1f;border-radius:12px;background:#1d1d1b;color:#ffce1f;font-size:14px;font-weight:700;cursor:pointer"></button>
  <button id="selbtn" style="display:none">まとめて選んで欠席にする</button>
  <div id="selbar"><span id="selcount"></span><div style="margin-top:8px"><button id="selgo">選んだ子を欠席にする</button><button id="selcancel">やめる</button></div></div>
  <div id="list"><div class="msg">読み込み中…</div></div>
  <p class="st" id="st"></p>
</main>
<div class="toast" id="toast"></div><div class="big" id="big"></div>
<script src="common.js"></script>
<script>
nav('check');
var D = null, PH = {}, PASS = '', CUR = -1, PENDING = 0, FILTER = '', SELMODE = false, SEL = {};
function catOf(s) { return s.kind === '欠席' ? '欠席' : (s.arr ? '到着' : 'まだ'); }
try { PASS = localStorage.getItem('kokunishi_check_pass') || ''; } catch (e) {}

function pickDay() {
  if (CUR >= 0 && CUR < D.days.length) return;
  CUR = D.days.findIndex(function (d) { return d.key >= D.today; });
  if (CUR < 0) CUR = D.days.length - 1;
}
function info(p, key) {
  var r = D.att[p.name + '|' + key], a = D.arr[p.name + '|' + key];
  return { kind: r ? r.kind : '出席', memo: r ? r.memo : '', arr: a || '' };
}
function render() {
  if (!D) return;
  if (!D.days.length) { $('dt').textContent = '予定なし'; $('list').innerHTML = '<div class="msg">練習・試合の予定がありません</div>'; return; }
  pickDay();
  var d = D.days[CUR];
  $('dt').textContent = d.label + (d.key === D.today ? ' 今日' : '');
  $('pv').disabled = CUR <= 0; $('nx').disabled = CUR >= D.days.length - 1;
  $('plan').innerHTML = '<p class="plan">A：' + esc(d.a) + '</p><p class="plan">NEXT：' + esc(d.n) + '</p>';
  var a = 0, w = 0, x = 0, gs = [], h = '';
  D.players.forEach(function (p) { var s = info(p, d.key); if (s.kind === '欠席') x++; else if (s.arr) a++; else w++; if (gs.indexOf(p.grade) < 0) gs.push(p.grade); });
  $('c1').textContent = a; $('c2').textContent = w; $('c3').textContent = x;
  $('s1').classList.toggle('on', FILTER === '到着'); $('s2').classList.toggle('on', FILTER === 'まだ'); $('s3').classList.toggle('on', FILTER === '欠席');
  var fb = $('fbar');
  if (FILTER) { var n = FILTER === '到着' ? a : (FILTER === 'まだ' ? w : x); fb.innerHTML = '「<b>' + FILTER + '</b>」の人だけ表示中（' + n + '人）。もう一度押すと全員に戻ります'; fb.style.display = 'block'; }
  else fb.style.display = 'none';
  gs.forEach(function (g) {
    var gh = '';
    D.players.forEach(function (p, i) {
      if (p.grade !== g) return;
      var s = info(p, d.key);
      if (FILTER && catOf(s) !== FILTER) return;
      var abs = s.kind === '欠席', note = s.kind !== '出席' ? s.kind + (s.memo ? '：' + s.memo : '') : '';
      var ph = PH[p.name] ? '<img class="ph" src="' + PH[p.name] + '" data-big="1">' : '<div class="ph">' + esc(p.name.charAt(0)) + '</div>';
      gh += '<div class="p' + (s.arr ? ' arr' : '') + (abs ? ' abs' : '') + (SEL[i] ? ' sel' : '') + '" data-i="' + i + '">' + ph + '<span class="ck">' + (SEL[i] ? '✓' : '') + '</span><div class="nm">' + esc(p.name) + (note ? '<small>' + esc(note) + '</small>' : '') + '</div>' +
        (abs ? '' : '<button class="ab' + (s.arr ? ' on' : '') + '" data-i="' + i + '">' + (s.arr ? '✓ ' + esc(s.arr) : '到着') + '</button>') +
        '<select data-i="' + i + '">' + ['出席', '欠席', '遅刻', '早退'].map(function (k) { return '<option' + (k === s.kind ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>';
    });
    if (gh) h += '<h2>' + esc(g) + '</h2>' + gh;
  });
  if (FILTER && !h) h = '<div class="msg">「' + FILTER + '」の人はいません</div>';
  $('list').innerHTML = h;
  var rest = D.players.filter(function (p) { var s = info(p, d.key); return s.kind === '出席' && !s.arr; });
  var bk = $('bulk');
  if (rest.length && !SELMODE) { bk.textContent = '残りの子を全員欠席にする（' + rest.length + '人）'; bk.style.display = 'block'; bk.dataset.n = rest.length; }
  else bk.style.display = 'none';
  var mada = D.players.filter(function (p) { return catOf(info(p, d.key)) === 'まだ'; }).length;
  $('selbtn').style.display = (!SELMODE && mada) ? 'block' : 'none';
  $('list').classList.toggle('selmode', SELMODE);
  var sb = $('selbar');
  if (SELMODE) { var n = Object.keys(SEL).length; $('selcount').textContent = '欠席にする子を選んでください（' + n + '人 選択中）。到着済み・欠席の子は選べません'; sb.style.display = 'block'; $('selgo').disabled = !n; $('selgo').style.opacity = n ? '1' : '.4'; }
  else sb.style.display = 'none';
}
function save() { cacheSet('kokunishi_check_cache', D); }

// ① 前回のデータと写真をすぐ表示
var C = cacheGet('kokunishi_check_cache');
PH = cacheGet('kokunishi_photos') || {};
if (C && C.days) { D = C; D.today = jpToday(); render(); $('st').textContent = '前回の内容を表示中…最新を確認しています'; }
function jpToday() {
  var p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  return p;
}

// ② 最新を取得（写真も同時に）
function load() {
  if (PENDING) return;
  api({ what: 'check', pass: PASS }).then(function (d) {
    if (d.needPass) { $('login').style.display = 'block'; $('list').innerHTML = ''; $('dt').textContent = ''; return; }
    $('login').style.display = 'none';
    try { localStorage.setItem('kokunishi_check_pass', PASS); } catch (e) {}
    var key = D && D.days[CUR] ? D.days[CUR].key : '';
    if (PENDING) return;
    D = d; CUR = key ? D.days.findIndex(function (x) { return x.key === key; }) : -1;
    save(); render();
    $('st').textContent = '最新の内容です（ほかの当番さんの入力も、開き直すと反映されます）';
  }).catch(function (e) {
    if (!D) $('list').innerHTML = '<div class="msg">読み込めませんでした。電波の良いところで開き直してください。<br><small>' + esc(e.message || e) + '</small></div>';
    else $('st').textContent = '最新の確認ができませんでした（前回の内容を表示中）';
  });
  api({ what: 'photos', pass: PASS }).then(function (d) {
    if (d && d.photos) { PH = d.photos; cacheSet('kokunishi_photos', PH); render(); }
  }).catch(function () {});
}
load();
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
$('go').onclick = function () { PASS = $('pass').value.trim(); load(); };

$('bulk').onclick = function () {
  if (!D) return;
  var key = D.days[CUR].key;
  var rest = D.players.filter(function (p) { var s = info(p, key); return s.kind === '出席' && !s.arr; });
  if (!rest.length) return;
  if (!confirm('まだ来ていない ' + rest.length + ' 人を、全員「欠席」にします。よろしいですか？\n（遅刻・早退の連絡がある子は、そのまま残ります）')) return;
  var bk = $('bulk'); bk.disabled = true; bk.textContent = '処理中…';
  rest.forEach(function (p) { var k = p.name + '|' + key; D.att[k] = { kind: '欠席', memo: D.att[k] ? D.att[k].memo : '' }; });
  save(); render(); PENDING++;
  var chain = Promise.resolve(), failed = 0;
  rest.forEach(function (p) {
    chain = chain.then(function () {
      return api({ what: 'checkset', key: key, name: p.name, kind: '欠席', memo: D.att[p.name + '|' + key].memo, pass: PASS }).catch(function () { failed++; });
    });
  });
  chain.then(function () {
    done(); bk.disabled = false; render();
    if (failed) alert(failed + '人分を保存できませんでした。開き直して確認してください。');
    else toast(rest.length + '人を欠席にしました');
  });
};
function setFilter(f) { FILTER = (FILTER === f) ? '' : f; render(); }
$('s1').onclick = function () { setFilter('到着'); };
$('s2').onclick = function () { setFilter('まだ'); };
$('s3').onclick = function () { setFilter('欠席'); };
$('pv').onclick = function () { if (CUR > 0) { CUR--; SEL = {}; SELMODE = false; render(); } };
$('nx').onclick = function () { if (D && CUR < D.days.length - 1) { CUR++; SEL = {}; SELMODE = false; render(); } };
$('selbtn').onclick = function () { SELMODE = true; SEL = {}; render(); window.scrollTo(0, 0); };
$('selcancel').onclick = function () { SELMODE = false; SEL = {}; render(); };
$('selgo').onclick = function () {
  var key = D.days[CUR].key;
  var targets = Object.keys(SEL).map(function (k) { return D.players[Number(k)]; }).filter(function (p) { return p && catOf(info(p, key)) === 'まだ'; });
  if (!targets.length) return;
  if (!confirm(targets.length + '人を「欠席」にします。よろしいですか？')) return;
  targets.forEach(function (p) { var k = p.name + '|' + key; D.att[k] = { kind: '欠席', memo: D.att[k] ? D.att[k].memo : '' }; delete D.arr[k]; });
  SELMODE = false; SEL = {}; save(); render(); PENDING++;
  var chain = Promise.resolve(), failed = 0;
  targets.forEach(function (p) {
    chain = chain.then(function () {
      return api({ what: 'checkset', key: key, name: p.name, kind: '欠席', memo: D.att[p.name + '|' + key].memo, pass: PASS }).catch(function () { failed++; });
    });
  });
  chain.then(function () {
    done(); render();
    if (failed) alert(failed + '人分を保存できませんでした。開き直して確認してください。');
    else toast(targets.length + '人を欠席にしました');
  });
};

function done() { PENDING = Math.max(0, PENDING - 1); }
$('list').addEventListener('click', function (e) {
  if (SELMODE) {
    var row = e.target.closest('.p'); if (!row || row.dataset.i === undefined) return;
    var pi = Number(row.dataset.i), pp = D.players[pi];
    if (catOf(info(pp, D.days[CUR].key)) !== 'まだ') { toast('到着済み・欠席の子は選べません'); return; }
    if (SEL[pi]) delete SEL[pi]; else SEL[pi] = 1;
    render(); return;
  }
  var im = e.target.closest('img[data-big]');
  if (im) { $('big').innerHTML = '<img src="' + im.src + '">'; $('big').style.display = 'flex'; return; }
  var b = e.target.closest('button.ab'); if (!b) return;
  var p = D.players[b.dataset.i], key = D.days[CUR].key, k = p.name + '|' + key, on = !D.arr[k];
  if (on) D.arr[k] = '…'; else delete D.arr[k];
  render(); PENDING++;
  api({ what: 'arrive', key: key, name: p.name, on: on ? '1' : '0', pass: PASS }).then(function (r) {
    done(); if (on) D.arr[k] = r.time; save(); render(); toast(on ? p.name + ' 到着' : '取り消しました');
  }).catch(function (err) {
    done(); if (on) delete D.arr[k]; render(); alert('保存できませんでした。もう一度押してください。\n' + (err.message || err));
  });
});
$('big').onclick = function () { this.style.display = 'none'; };
$('list').addEventListener('change', function (e) {
  if (e.target.tagName !== 'SELECT') return;
  var p = D.players[e.target.dataset.i], key = D.days[CUR].key, k = p.name + '|' + key, kind = e.target.value;
  var memo = D.att[k] ? D.att[k].memo : '';
  if (kind === '出席' && !memo) delete D.att[k]; else D.att[k] = { kind: kind, memo: memo };
  if (kind === '欠席') delete D.arr[k];
  render(); save(); PENDING++;
  api({ what: 'checkset', key: key, name: p.name, kind: kind, memo: memo, pass: PASS }).then(function () {
    done(); toast(p.name + '：' + kind);
  }).catch(function (err) { done(); alert('保存できませんでした。もう一度選んでください。\n' + (err.message || err)); });
});
</script>
<script src="aiop.js"></script>
</body>
</html>
