<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>国西Monsters URLまとめ（係用）</title>
<link rel="icon" href="mark.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
body{margin:0;background:#f6f6f4;color:#1d1d1b;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{background:#1d1d1b;color:#fff;padding:16px}header h1{margin:0;font-size:17px}header p{margin:4px 0 0;font-size:12px;opacity:.75}
main{padding:12px 16px 40px;max-width:560px;margin:0 auto}section{margin-bottom:18px}
.gh{border-radius:10px;padding:10px 12px;margin-bottom:8px}.gh b{display:block;font-size:15px}.gh span{font-size:12px}
.it{background:#fff;border:1px solid #e3e1db;border-left:5px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.n{font-weight:700}.d{font-size:12px;color:#555;margin:2px 0 6px;line-height:1.5}.u{font-size:11px;color:#2f6fb3;word-break:break-all}
.bt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.bt button{border:1px solid #e3e1db;background:#f6f6f4;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none}
.card{background:#fff;border:1px solid #e3e1db;border-radius:12px;padding:14px;margin-bottom:12px}
.card label{font-size:12px;color:#77756f;display:block;margin-bottom:6px}
.card input{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border-radius:8px;border:1px solid #e3e1db;background:#fff}
.card button{width:100%;margin-top:10px;background:#1d1d1b;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700}
.msg{text-align:center;padding:30px 10px;color:#77756f}
</style>
</head>
<body>
<header><h1>国西Monsters URLまとめ（係用）</h1><p>誰に・どこで共有するかごとにまとめています。このページは係の中だけで使ってください</p></header>
<main>
  <div class="card" id="login" style="display:none"><label>係用パスコード</label><input type="password" id="pass" inputmode="numeric" autocomplete="off"><button id="go">開く</button></div>
  <div id="list"><div class="msg">読み込み中…</div></div>
</main>
<div class="toast" id="t"></div>
<script>
var GAS = 'https://script.google.com/macros/s/AKfycbzWKxTzp-gFCTlm5i-hG02nMi_izvL6k5xKX6Kkl_a-sBGoyK1wJoWLtrCyrT1owAv1WA/exec';
function api(params) {
  var q = 'mode=api&t=' + Date.now();
  Object.keys(params).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(params[k]); });
  return fetch(GAS + '?' + q).then(function (r) { return r.json(); }).then(function (d) { if (d && d.error) throw new Error(d.error); return d; });
}
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var PASS = '';
try { PASS = localStorage.getItem('kokunishi_plan_pass') || ''; } catch (e) {}

function load() {
  api({ what: 'links', pass: PASS }).then(function (d) {
    if (d.needPass) {
      $('login').style.display = 'block';
      $('list').innerHTML = PASS ? '<div class="msg">パスコードが違います</div>' : '';
      return;
    }
    try { localStorage.setItem('kokunishi_plan_pass', PASS); } catch (e) {}
    $('login').style.display = 'none';
    var body = '';
    d.groups.forEach(function (g, gi) {
      body += '<section><div class="gh" style="background:' + esc(g.bg) + ';color:' + esc(g.c) + '"><b>' + esc(g.t) + '</b><span>' + esc(g.s) + '</span></div>';
      g.items.forEach(function (it, ii) {
        var id = gi + '_' + ii;
        body += '<div class="it" style="border-left-color:' + esc(g.c) + '"><div class="n">' + esc(it.n) + '</div><div class="d">' + esc(it.d) + '</div>' +
          '<a class="u" href="' + esc(it.u) + '" target="_blank">' + esc(it.u.replace(/^https:\/\//, '')) + '</a>' +
          '<div class="bt"><button data-c="u' + id + '">URLをコピー</button>' + (it.m ? '<button data-c="m' + id + '">LINE用の文をコピー</button>' : '') + '</div>' +
          '<textarea id="u' + id + '" hidden>' + esc(it.u) + '</textarea>' + (it.m ? '<textarea id="m' + id + '" hidden>' + esc(it.m) + '</textarea>' : '') + '</div>';
      });
      body += '</section>';
    });
    $('list').innerHTML = body;
  }).catch(function (e) {
    $('list').innerHTML = '<div class="msg">読み込めませんでした。電波の良いところで開き直してください。<br><small>' + esc(e.message || e) + '</small></div>';
  });
}
$('go').onclick = function () { PASS = $('pass').value.trim(); load(); };
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-c]'); if (!b) return;
  var v = document.getElementById(b.dataset.c).value;
  function ok() { var t = $('t'); t.textContent = 'コピーしました'; t.style.display = 'block'; setTimeout(function () { t.style.display = 'none'; }, 1500); }
  function fb(s) { var a = document.createElement('textarea'); a.value = s; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (err) { prompt('コピーしてください', s); } document.body.removeChild(a); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(v).then(ok, function () { fb(v); }); } else fb(v);
});
load();
</script>
</body>
</html>
