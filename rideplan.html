<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>国西Monsters 配車（係用）</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --sub:#77756f; --line:#e3e1db;
--a:#2f6fb3; --a-bg:#e3eefa; --n:#3f8a3a; --n-bg:#e4f2df; --we:#fbf3f3; --chg:#c0392b; --pur:#6a4fa3; --pur-bg:#ece6f7;}
* { box-sizing:border-box;}
body { margin:0; background:var(--bg); color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:15px;}
header { background:#1d1d1b; color:#fff; padding:16px;}
header h1 { margin:0; font-size:17px;}
header p { margin:4px 0 0; font-size:12px; opacity:.75;}
main { padding:12px 16px 220px; max-width:560px; margin:0 auto;}
.help { font-size:12px; color:var(--sub); margin:0 0 12px; line-height:1.6;}
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px;}
input[type=text], input[type=password], select { width:100%; font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--line); background:#fff;}
.btn { background:#1d1d1b; color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700;}
.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line);}
.btn.pur { background:var(--pur);}
.btn:disabled { opacity:.4;}
.day { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
.day.we { background:var(--we);}
.day.on { border-color:var(--pur); border-width:2px;}
.dh { font-weight:700; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:8px;}
.row { display:flex; gap:8px; align-items:center; padding:3px 0; font-size:13px; flex-wrap:wrap;}
.tag { font-size:11px; font-weight:700; border-radius:4px; padding:2px 6px; min-width:44px; text-align:center;}
.tag.a { background:var(--a-bg); color:var(--a);}.tag.n { background:var(--n-bg); color:var(--n);}
.tag.car { background:#fbefd6; color:#8a5a00;}.tag.ride { background:var(--a-bg); color:var(--a);}
.tag.self { background:#e4f2df; color:var(--n);}.tag.out { background:#eee; color:var(--sub);}
.memo { font-size:11px; color:var(--sub); margin-top:2px;}
.msg { text-align:center; padding:30px 10px; color:var(--sub);}
.tgl { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; color:var(--sub);}
.tgl.on { background:#1d1d1b; border-color:#1d1d1b; color:#fff;}
.tgl.on.pur { background:var(--pur); border-color:var(--pur);}
.lbl { font-size:11px; color:var(--sub); margin:8px 0 4px;}
.setgrid { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px;}
.setgrid input[type=text] { flex:1; min-width:110px;}
h2 { font-size:15px; margin:20px 0 8px;}
h3 { font-size:13px; margin:14px 0 6px;}
.grp { font-size:14px; padding:4px 0; line-height:1.7;}
.grp.who { font-weight:700;}
.grp.mm { color:var(--chg); font-size:12px;}
.car { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;}
.car.drop { border-color:var(--pur); background:var(--pur-bg);}
.car.ch { display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.car.ch.nm { font-weight:700; font-size:16px;}
.car.ch select { flex:1; width:auto; font-size:14px; padding:7px;}
.car.ch.del { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:var(--chg);}
.kids,.ads { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0;}
.kid { border:1.5px solid var(--a); background:var(--a-bg); color:var(--ink); border-radius:999px; padding:7px 12px; font-size:14px; font-weight:700;}
.kid.sel { background:var(--pur); border-color:var(--pur); color:#fff;}
.kid.why { font-size:10px; color:var(--chg); font-weight:700; margin-left:4px;}
.ad { border:1.5px solid var(--n); background:var(--n-bg); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700;}
.sect { border:1.5px dashed var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; background:#fff;}
.sect.drop { border-color:var(--pur); background:var(--pur-bg);}
.sect.sh { font-weight:700; font-size:13px; margin-bottom:6px;}
.adin { display:flex; gap:6px; margin-top:6px;}
.adin input { flex:1; font-size:14px; padding:8px;}
.adin button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700; white-space:nowrap;}
.warn { background:#fde8e6; color:var(--chg); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:8px; line-height:1.6;}
.spare button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; margin:0 6px 6px 0;}
.fx { display:flex; gap:6px; align-items:center; padding:4px 0; font-size:14px; flex-wrap:wrap;}
.fx button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--chg);}
.acts { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.acts.btn { flex:1; white-space:nowrap;}
.notify { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid #06c755; box-shadow:0 -4px 16px rgba(0,0,0,.12); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:8;}
.notify.in { max-width:560px; margin:0 auto;}
.notify.t { font-weight:700; font-size:14px; margin-bottom:6px;}
.notify pre { white-space:pre-wrap; font-family:inherit; font-size:12px; background:#f6f6f4; border-radius:8px; padding:8px; margin:0 0 8px; max-height:180px; overflow:auto;}
.notify.row2 { display:flex; gap:8px;}
.notify a,.notify button { flex:1; text-align:center; border-radius:10px; padding:11px 0; font-size:14px; font-weight:700; text-decoration:none; border:0;}
.notify.line { background:#06c755; color:#fff;}.notify.cp { background:#f6f6f4; color:#1d1d1b; border:1px solid #e3e1db;}.notify.x { flex:0 0 64px; background:#fff; color:#77756f; border:1px solid #e3e1db;}
.toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#1d1d1b; color:#fff;
padding:10px 18px; border-radius:999px; font-size:14px; display:none; z-index:9;}
</style>
</head>
<body>
<header>
<h1>国西Monsters 配車（係用）</h1>
<p id="sub">読み込み中…</p>
</header>
<main>
<div id="login" class="card" style="display:none">
<div class="lbl">係用パスコード</div>
<input type="password" id="pass" inputmode="numeric" autocomplete="off">
<div style="margin-top:10px;text-align:right"><button class="btn" id="go">開く</button></div>
</div>
<div id="app" style="display:none">
<h2>配車の日を選ぶ</h2>
<p class="help">配車がいる日を「対象にする」にしてください。遠い会場の日は「遠い会場」も付けると、我が子を自分の車に優先して組みます。出発時間と見出し（試合名など）は、LINEで送る文に使います。</p>
<div id="days"></div>
<div class="card">
<h3 style="margin-top:0">車酔い等の固定指定</h3>
<p class="help">決まった車にしか乗せない子は、ここで指定してください（例：車酔い）。自動配車では絶対条件になります。指定の車が出ていない日は、その子は「要確認」に出ます。</p>
<div id="fxlist"></div>
<div class="lbl">子を選ぶ</div>
<select id="fxplayer"></select>
<div class="lbl">乗せてよい車（運転手の家庭）</div>
<select id="fxdriver"></select>
<div style="margin-top:10px;text-align:right"><button class="btn ghost" id="fxset">指定する</button></div>
</div>
<div id="detail"></div>
</div>
</main>
<div class="notify" id="notify" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbzWKxTzp-gFCTlm5i-hG02nMi_izvL6k5xKX6Kkl_a-sBGoyK1wJoWLtrCyrT1owAv1WA/exec';
function api(params) {
var q = 'mode=api&t=' + Date.now();
Object.keys(params).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(params[k]);});
return fetch(GAS + '?' + q).then(function (r) { return r.json();}).then(function (d) { if (d && d.error) throw new Error(d.error); return d;});
}
</script>
<script>
let PASS = '', D = null, SEL = '', PLAN = null, SELKID = '';
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null? '': s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));}
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 2200);}
function given(name) { const p = String(name || '').split(/[\s　]+/); return p.length > 1? p[1]: name;}
function dayOf(key) { return D? D.days.find(d => d.key === key): null;}
function emptyPlan() { return { cars: [], self: [], roles: [], unassigned: [], spare: [], warnings: [], absent: []};}
function copyPlan(p) { return JSON.parse(JSON.stringify(p || emptyPlan()));}

try { PASS = localStorage.getItem('kokunishi_plan_pass') || '';} catch (e) {}
load();
$('go').addEventListener('click', () => { PASS = $('pass').value.trim(); load();});

function load() {
$('detail').innerHTML = '';
api({ what: 'rideplan', pass: PASS}).then(d => {
if (d.needPass) {
$('login').style.display = 'block'; $('app').style.display = 'none';
$('sub').textContent = PASS? 'パスコードが違います': 'パスコードを入力してください';
return;
}
try { localStorage.setItem('kokunishi_plan_pass', PASS);} catch (e) {}
D = d; $('login').style.display = 'none'; $('app').style.display = 'block';
$('sub').textContent = '対象日の設定・希望の確認・自動配車・手直しができます';
renderDays(); renderFx();
if (SEL && dayOf(SEL)) openDay(SEL); else $('detail').innerHTML = '';
}).catch(e => { $('sub').textContent = 'エラー：' + (e.message || e);});
}

function renderDays() {
$('days').innerHTML = D.days.map(d => {
const we = (d.w === '土' || d.w === '日' || d.hol)? ' we': '';
let h = '<div class="day' + we + (d.on? ' on': '') + '"><div class="dh"><span>' + esc(d.label) + '</span>' +
'<button class="tgl pur' + (d.on? ' on': '') + '" data-ev="' + d.key + '" data-f="on">' + (d.on? '対象にする ✓': '対象にする') + '</button></div>';
h += '<div class="row"><span class="tag a">A</span><span>' + esc(d.a || '―') + '</span></div>';
h += '<div class="row"><span class="tag n">NEXT</span><span>' + esc(d.n || '―') + '</span></div>';
if (d.on) {
h += '<div class="setgrid">' +
'<button class="tgl' + (d.far? ' on': '') + '" data-ev="' + d.key + '" data-f="far">遠い会場</button>' +
'<button class="tgl' + (d.bag? ' on': '') + '" data-ev="' + d.key + '" data-f="bag">荷物が必要</button></div>' +
'<div class="setgrid"><input type="text" data-evin="' + d.key + '" data-f="dep" value="' + esc(d.dep) + '" placeholder="出発時間（例：7:20）">' +
'<input type="text" data-evin="' + d.key + '" data-f="title" value="' + esc(d.title) + '" placeholder="見出し（例：A練習試合）"></div>' +
'<div class="setgrid"><button class="btn pur" data-open="' + d.key + '">この日の配車を開く</button>' +
(d.plan? '<span class="memo">配車の下書き・確定あり</span>': '<span class="memo">配車はまだです</span>') + '</div>';
}
return h + '</div>';
}).join('') || '<div class="msg">予定表に試合・練習の日がまだありません</div>';
}

$('days').addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
if (b.dataset.open) { openDay(b.dataset.open); return;}
if (b.dataset.ev) {
const d = dayOf(b.dataset.ev), f = b.dataset.f;
d[f] =!d[f];
saveEvent(d); renderDays();
if (SEL === d.key) renderDetail();
}
});
$('days').addEventListener('change', e => {
const el = e.target; if (!el.dataset ||!el.dataset.evin) return;
const d = dayOf(el.dataset.evin);
d[el.dataset.f] = el.value;
saveEvent(d);
});
function saveEvent(d) {
api({ what: 'rideevent', pass: PASS, key: d.key, on: d.on? '1': '0', far: d.far? '1': '0', bag: d.bag? '1': '0', dep: d.dep || '', title: d.title || ''})
.catch(err => alert('設定を保存できませんでした：' + (err.message || err)));
}

function renderFx() {
const fx = D.fixed || {};
const keys = Object.keys(fx);
$('fxlist').innerHTML = keys.length? keys.map(k =>
'<div class="fx"><span><b>' + esc(k) + '</b> → ' + esc(fx[k]) + ' の車だけ</span><button data-fxdel="' + esc(k) + '">解除</button></div>').join('')
: '<p class="help">いま指定はありません</p>';
$('fxplayer').innerHTML = D.players.map(p => '<option>' + esc(p.name) + '</option>').join('');
$('fxdriver').innerHTML = D.names.map(n => '<option>' + esc(n) + '</option>').join('');
}
$('fxset').addEventListener('click', () => {
api({ what: 'ridefixed', pass: PASS, player: $('fxplayer').value, driver: $('fxdriver').value})
.then(r => { D.fixed = r.fixed; renderFx(); toast('指定しました');})
.catch(e => alert('指定できませんでした：' + (e.message || e)));
});
$('fxlist').addEventListener('click', e => {
const b = e.target.closest('button[data-fxdel]'); if (!b) return;
api({ what: 'ridefixed', pass: PASS, player: b.dataset.fxdel, driver: ''})
.then(r => { D.fixed = r.fixed; renderFx(); toast('解除しました');})
.catch(err => alert('解除できませんでした：' + (err.message || err)));
});

function openDay(key) {
SEL = key; SELKID = '';
const d = dayOf(key);
PLAN = copyPlan(d.plan);
renderDetail();
setTimeout(() => { const el = $('detail'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start'});}, 50);
}

function ansGroups(d) {
const g = { car: [], ride: [], self: [], out: [], none: []};
D.names.forEach(n => {
const a = (d.answers || {})[n];
if (!a ||!a.st) { g.none.push(n); return;}
g[a.st].push({ name: n, a: a, kids: (D.kids[n] || [])});
});
return g;
}

function renderDetail() {
const d = dayOf(SEL); if (!d ||!PLAN) { $('detail').innerHTML = ''; return;}
const g = ansGroups(d);
const line = (cls, lb, list, fmt) => list.length? '<div class="grp"><span class="tag ' + cls + '">' + lb + '</span> ' +
list.map(fmt).join('、') + '</div>': '';
let h = '<h2>' + esc(d.label) + ' の配車' + (d.far? '（遠い会場）': '') + '</h2>';
h += '<h3>希望の一覧</h3>';
h += line('car', '車を出せる', g.car, x => '<span class="who">' + esc(x.name) + '</span>（後ろ' + (x.a.seats || 0) + '人' + (x.a.bag? '・荷物OK': '') + '・過去' + (D.counts[x.name] || 0) + '回）' + (x.a.memo? ' <span class="mm">' + esc(x.a.memo) + '</span>': ''));
h += line('ride', '乗せてほしい', g.ride, x => '<span class="who">' + esc(x.name) + '</span>（' + x.kids.map(esc).join('・') + '）' + (x.a.memo? ' <span class="mm">' + esc(x.a.memo) + '</span>': ''));
h += line('self', '自走', g.self, x => '<span class="who">' + esc(x.name) + '</span>' + (x.a.memo? ' <span class="mm">' + esc(x.a.memo) + '</span>': ''));
h += line('out', '不参加', g.out, x => '<span class="who">' + esc(x.name) + '</span>');
h += line('out', '未回答', g.none, x => '<span class="who">' + esc(x) + '</span>');
if (!g.car.length &&!g.ride.length) h += '<p class="help">まだ希望が入っていません。</p>';

h += '<div class="acts"><button class="btn pur" id="autobtn">自動で組む</button>' +
'<button class="btn" id="savebtn">保存する（確定）</button>' +
'<button class="btn ghost" id="linebtn">LINE用の文を作る</button></div>';
h += '<p class="help">子の名前を押して選び、移したい車（または自走・要確認の欄）を押すと移ります。大人（同乗の母・コーチ・審判）は自動では置かないので、車ごとに名前を入れてください。直したら「保存する」を押してください。</p>';

(PLAN.warnings || []).forEach(w => { h += '<div class="warn">⚠ ' + esc(w) + '</div>';});
if ((PLAN.absent || []).length) h += '<div class="warn" style="background:#e3eefa;color:#2f6fb3">出欠連絡で欠席の子は外しています：' + PLAN.absent.map(esc).join('・') + '</div>';

PLAN.cars.forEach((c, i) => { h += carHtml(c, i);});
h += sectHtml('self', '自走', PLAN.self.map(nm => kidHtml(nm, 'self', '')));
h += '<div class="sect" id="roles"><div class="sh">役割（ポット当番など）</div><div class="kids">' +
PLAN.roles.map((r, i) => '<button class="ad" data-role="' + i + '">' + esc(r.label) + '：' + esc(r.who) + ' ✕</button>').join('') + '</div>' +
'<div class="adin"><input type="text" id="rolelabel" placeholder="役割（例：ポット当番）"><input type="text" id="rolewho" placeholder="名前"><button id="roleadd">追加</button></div></div>';
h += sectHtml('unassigned', '要確認（まだ車が決まっていない子）', PLAN.unassigned.map(u => kidHtml(u.name, 'unassigned', u.why || '')));
h += '<div class="sect"><div class="sh">車を追加（コーチの車など）</div>' +
'<div class="adin"><input type="text" id="newdriver" placeholder="運転手の名前（例：ゆきコーチ）"><button id="addcar">車を追加</button></div></div>';
if (PLAN.spare.length) h += '<div class="sect"><div class="sh">予備の車（今回使わない車出し希望）</div><div class="spare">' +
PLAN.spare.map(nm => '<button data-spare="' + esc(nm) + '">' + esc(nm) + ' を車にする</button>').join('') + '</div></div>';

$('detail').innerHTML = h;
$('autobtn').onclick = doAuto;
$('savebtn').onclick = doSave;
$('linebtn').onclick = showLine;
$('roleadd').onclick = () => {
const lb = $('rolelabel').value.trim(), who = $('rolewho').value.trim();
if (!lb &&!who) return;
PLAN.roles.push({ label: lb, who: who}); renderDetail();
};
$('addcar').onclick = () => {
const v = $('newdriver').value.trim();
if (!v) return;
PLAN.cars.push({ driver: v, kids: [], adults: [], bag: false}); renderDetail();
};
}
function kidHtml(nm, zone, why) {
return '<button class="kid' + (SELKID === nm? ' sel': '') + '" data-kid="' + esc(nm) + '">' + esc(nm) + (why? '<span class="why">' + esc(why) + '</span>': '') + '</button>';
}
function driverOpts_(cur) {
const opts = [];
(D.names || []).concat(D.staff || []).forEach(n => { if (n && opts.indexOf(n) < 0) opts.push(n);});
if (cur && opts.indexOf(cur) < 0) opts.unshift(cur);
return opts.map(n => '<option' + (n === cur? ' selected': '') + '>' + esc(n) + '</option>').join('');
}
function carHtml(c, i) {
let h = '<div class="car" data-drop="car:' + i + '"><div class="ch"><span class="nm">🚗</span>' +
'<select data-driver="' + i + '">' + driverOpts_(c.driver) + '</select>' +
'<span class="nm">号</span>' +
'<button class="tgl' + (c.bag? ' on': '') + '" data-bag="' + i + '">荷物</button>' +
'<button class="del" data-delcar="' + i + '">車を消す</button></div>';
h += '<div class="lbl">子ども（' + c.kids.length + '人）</div><div class="kids">' + c.kids.map(nm => kidHtml(nm, 'car', '')).join('') + '</div>';
h += '<div class="lbl">大人（同乗）</div><div class="ads">' + c.adults.map((a, ai) => '<button class="ad" data-adult="' + i + ':' + ai + '">' + esc(a) + ' ✕</button>').join('') + '</div>' +
'<div class="adin"><input type="text" id="adin' + i + '" placeholder="大人の名前（例：板倉母、ゆきコーチ）"><button data-addadult="' + i + '">追加</button></div>';
return h + '</div>';
}
function sectHtml(zone, title, inner) {
return '<div class="sect" data-drop="' + zone + '"><div class="sh">' + title + '</div><div class="kids">' + inner + '</div></div>';
}

function kidLists() {
const L = [{ get: () => PLAN.self, set: v => { PLAN.self = v;}},
{ get: () => PLAN.unassigned.map(u => u.name), set: v => { const keep = {}; PLAN.unassigned.forEach(u => { keep[u.name] = u.why; }); PLAN.unassigned = v.map(nm => ({ name: nm, why: keep[nm] || '' })); }}];
PLAN.cars.forEach((c, i) => L.push({ get: () => PLAN.cars[i].kids, set: v => { PLAN.cars[i].kids = v;}}));
return L;
}
function moveKid(name, target) {
kidLists().forEach(L => { const a = L.get(); const ix = a.indexOf(name); if (ix >= 0) { a.splice(ix, 1); L.set(a);}});
if (target === 'self') PLAN.self.push(name);
else if (target === 'unassigned') PLAN.unassigned.push({ name: name, why: ''});
else if (target.indexOf('car:') === 0) PLAN.cars[Number(target.slice(4))].kids.push(name);
}
$('detail').addEventListener('click', e => {
const kb = e.target.closest('[data-kid]');
if (kb) { SELKID = (SELKID === kb.dataset.kid)? '': kb.dataset.kid; renderDetail(); return;}
const ab = e.target.closest('[data-adult]');
if (ab) { const p = ab.dataset.adult.split(':'); PLAN.cars[Number(p[0])].adults.splice(Number(p[1]), 1); renderDetail(); return;}
const rb = e.target.closest('[data-role]');
if (rb) { PLAN.roles.splice(Number(rb.dataset.role), 1); renderDetail(); return;}
const sb = e.target.closest('[data-spare]');
if (sb) {
PLAN.spare = PLAN.spare.filter(n => n!== sb.dataset.spare);
PLAN.cars.push({ driver: sb.dataset.spare, kids: [], adults: [], bag: false});
renderDetail(); return;
}
const bb = e.target.closest('[data-bag]');
if (bb) { const c = PLAN.cars[Number(bb.dataset.bag)]; c.bag =!c.bag; renderDetail(); return;}
const db = e.target.closest('[data-delcar]');
if (db) {
const i = Number(db.dataset.delcar), c = PLAN.cars[i];
if (!confirm(c.driver + '号を消しますか？（子どもは「要確認」に移ります）')) return;
c.kids.forEach(nm => PLAN.unassigned.push({ name: nm, why: ''}));
if (PLAN.spare.indexOf(c.driver) < 0) PLAN.spare.push(c.driver);
PLAN.cars.splice(i, 1); renderDetail(); return;
}
const aa = e.target.closest('[data-addadult]');
if (aa) {
const i = Number(aa.dataset.addadult), inp = $('adin' + i), v = inp.value.trim();
if (v) { PLAN.cars[i].adults.push(v); renderDetail();}
return;
}
const dz = e.target.closest('[data-drop]');
if (dz && SELKID) { moveKid(SELKID, dz.dataset.drop); SELKID = ''; renderDetail();}
});
$('detail').addEventListener('change', e => {
const s = e.target.closest('select[data-driver]');
if (s) { PLAN.cars[Number(s.dataset.driver)].driver = s.value; renderDetail();}
});

function doAuto() {
const b = $('autobtn'); b.disabled = true; b.textContent = '組んでいます…';
api({ what: 'rideauto', pass: PASS, key: SEL}).then(r => {
const d = dayOf(SEL); d.plan = r.plan; PLAN = copyPlan(r.plan); SELKID = '';
renderDays(); renderDetail(); toast('自動で組みました。手直しして保存してください');
}).catch(e => { b.disabled = false; b.textContent = '自動で組む'; alert('自動配車できませんでした：' + (e.message || e));});
}
function doSave() {
const b = $('savebtn'); b.disabled = true; b.textContent = '保存中…';
api({ what: 'rideplansave', pass: PASS, key: SEL, plan: JSON.stringify(PLAN)}).then(r => {
const d = dayOf(SEL); d.plan = r.plan; PLAN = copyPlan(r.plan);
renderDays(); renderDetail(); toast('保存しました');
}).catch(e => { b.disabled = false; b.textContent = '保存する（確定）'; alert('保存できませんでした：' + (e.message || e));});
}

function lineText() {
const d = dayOf(SEL);
const title = d.title || d.a || d.n || '';
const L = ['', title, '国西出発 ' + (d.dep || '未定'), ''];
PLAN.cars.forEach(c => {
L.push('■' + c.driver + '号' + (c.bag? '（荷物）': ''));
if (c.adults.length) L.push('大人：' + c.adults.join('・'));
L.push('子ども：' + (c.kids.map(given).join('・') || 'なし'));
L.push('');
});
if (PLAN.self.length) { L.push('■自走'); L.push(PLAN.self.map(given).join('・')); L.push('');}
PLAN.roles.forEach(r => { L.push('■' + r.label); L.push(r.who); L.push('');});
if (PLAN.unassigned.length) { L.push('■まだ決まっていない子'); L.push(PLAN.unassigned.map(u => given(u.name)).join('・')); L.push('');}
L.push('');
L.push('・氷嚢ボックス、バズーカ・ペタペタ');
L.push('・作戦版、救急バック');
L.push('・スコアバック');
L.push('');
L.push('・団旗、物干し・シート');
L.push('・トイレセット、三脚・毛布');
return L.join('\n');
}
function showLine() {
const txt = lineText();
const box = $('notify');
box.innerHTML = '<div class="in"><div class="t">LINEでお知らせ（配車）</div><pre>' + esc(txt) + '</pre>' +
'<div class="row2"><a class="line" href="https://line.me/R/share?text=' + encodeURIComponent(txt) + '" target="_blank">LINEで送る</a>' +
'<button class="cp" id="lcp">文をコピー</button><button class="x" id="lx">閉じる</button></div></div>';
box.style.display = 'block';
$('lcp').onclick = () => {
const ok = () => toast('コピーしました。LINEに貼って送ってください');
if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => prompt('コピーしてください', txt)); else prompt('コピーしてください', txt);
};
$('lx').onclick = () => { box.style.display = 'none';};
}
</script>
</body>
</html>
