<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>国西Monsters 当番希望</title>
<link rel="stylesheet" href="theme.css?v=8">
<meta name="theme-color" content="#070707">
<link rel="icon" href="mark.png">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body class="pg-duty">
<header><div class="brand"><img class="mark" src="mark.png" alt=""><div class="wm">KOKUNISHI<b>MONSTERS</b></div></div>
<h1>当番希望</h1><p id="sub">読み込み中…</p></header>
<nav id="nav"></nav>
<main>
  <div class="pick">
    <label for="who">お名前を選んでください</label>
    <select id="who" disabled><option value="">読み込み中…</option></select>
  </div>
  <p class="help">当番に入れる日の「入る」を押してください。兄弟でA・NEXT両方の家庭は、その日に入るチームを1つ選んでください。もう一度押すと取り消せます。最後に「保存する」を押すと完了です。</p>
  <div id="list"><div class="msg">読み込み中…</div></div>
  <p class="st" id="st"></p>
</main>
<div class="bar"><div class="in">
  <div class="sum" id="sum">名前を選ぶと入力できます</div>
  <button class="save" id="save" disabled>保存する</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="common.js"></script>
<script>
nav('duty');
var NDAYS = 31, CACHE_KEY = 'kokunishi_duty_cache';
var DATA = null, VALS = null, NAME = '', dirty = false, fresh = false, saving = false, reqId = 0;
try { NAME = localStorage.getItem('kokunishi_duty') || ''; } catch (e) {}

function normVals(v) {
  var out = [];
  for (var i = 0; i < NDAYS; i++) { var x = v && v[i] != null ? String(v[i]) : ''; out.push(x === 'A' || x === 'N' ? x : ''); }
  return out;
}
function fillNames(names) {
  $('who').innerHTML = '<option value="">― 選択 ―</option>' +
    names.map(function (n) { return '<option' + (n === NAME ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
  $('who').disabled = false;
}
function setSub() { $('sub').textContent = DATA.title + '　' + DATA.days.length + '日分'; }
function msg(t) { $('list').innerHTML = '<div class="msg">' + t + '</div>'; }
function keepCache() {
  if (!DATA) return;
  cacheSet(CACHE_KEY, { title: DATA.title, days: DATA.days, names: DATA.names, meName: VALS ? NAME : '', me: VALS });
}

// ① 前回のデータをすぐ表示（最新が届くまで保存・入力はロック）
var C = cacheGet(CACHE_KEY);
if (C && C.days && C.names) {
  DATA = C; fillNames(C.names); setSub();
  if (NAME && C.meName === NAME && C.me) { VALS = normVals(C.me); render(); $('st').textContent = '前回の内容を表示中…最新を確認しています'; }
  else if (!NAME) msg('まずお名前を選んでください');
  else msg('読み込み中…');
}

// ② 最新を取得
function load(n) {
  var my = ++reqId; fresh = false;
  return api({ what: 'duty', name: n || '' }).then(function (d) {
    if (my !== reqId) return;
    DATA = d; fillNames(d.names); setSub();
    if (n && d.me) { VALS = normVals(d.me); dirty = false; fresh = true; render(); }
    else if (n) { VALS = null; summary(); msg('名簿にお名前がありません。選び直してください'); }
    else { VALS = null; summary(); msg('まずお名前を選んでください'); }
    keepCache();
    $('st').textContent = '最新の内容です';
  }).catch(function (e) {
    if (my !== reqId) return;
    if (!VALS) msg('読み込めませんでした。電波の良いところで開き直してください。<br><small>' + esc(e.message || e) + '</small>');
    else $('st').textContent = '最新の確認ができませんでした（前回の内容を表示中。保存はできません）';
  });
}
load(NAME);

$('who').addEventListener('change', function (e) {
  var n = e.target.value;
  if (dirty && !confirm('保存していない変更があります。名前を切り替えますか？')) { e.target.value = NAME; return; }
  NAME = n; dirty = false; VALS = null; fresh = false;
  try { localStorage.setItem('kokunishi_duty', n); } catch (err) {}
  if (!n) { reqId++; msg('まずお名前を選んでください'); summary(); return; }
  msg('読み込み中…'); summary();
  load(n);
});

function line(cls, label, plan, btn) {
  var p = plan || '―', off = !plan || plan === '休み' || plan === '応援';
  return '<div class="row"><span class="tag ' + cls + '">' + label + '</span><span class="plan' + (off ? ' off' : '') + '">' + esc(p) + '</span>' + btn + '</div>';
}
function chip(i, val, text, cls) {
  return '<button class="opt ' + cls + (VALS[i] === val ? ' on' : '') + '" data-i="' + i + '" data-v="' + val + '">' + text + '</button>';
}
function render() {
  if (!DATA || !VALS) return;
  if (!DATA.days.length) { msg('今月の対象日はまだありません'); summary(); return; }
  $('list').innerHTML = DATA.days.map(function (d) {
    var we = (d.w === '土' || d.w === '日' || d.hol) ? ' we' : '';
    return '<div class="day' + we + '"><div class="dh"><span>' + d.m + '/' + d.d + '（' + esc(d.w) + (d.hol ? '・祝' : '') + '）</span>' +
      (d.memo ? '<small>' + esc(d.memo) + '</small>' : '') + '</div>' +
      line('a', 'A', d.a, d.needA ? chip(d.i, 'A', '入る', 'a') : '') +
      line('n', 'NEXT', d.n, d.needN ? chip(d.i, 'N', '入る', 'n') : '') + '</div>';
  }).join('');
  summary();
}
function summary() {
  if (!DATA || !VALS) { $('sum').textContent = '名前を選ぶと入力できます'; $('save').disabled = true; return; }
  var n = DATA.days.filter(function (d) { return VALS[d.i]; }).length;
  $('sum').textContent = '希望 ' + n + '日' + (dirty ? '（未保存）' : '');
  $('save').disabled = !dirty || !fresh || saving;
}
$('list').addEventListener('click', function (e) {
  var b = e.target.closest('button.opt'); if (!b || !VALS) return;
  if (!fresh) { toast('最新を確認しています。少し待ってください'); return; }
  if (saving) return;
  var i = Number(b.dataset.i), v = b.dataset.v;
  VALS[i] = (VALS[i] === v) ? '' : v;
  dirty = true; render();
});
$('save').addEventListener('click', function () {
  if (!NAME || !VALS || saving) return;
  saving = true; $('save').disabled = true; $('save').textContent = '保存中…';
  api({ what: 'dutyset', name: NAME, vals: VALS.join(',') }).then(function () {
    saving = false; dirty = false; $('save').textContent = '保存する'; keepCache(); summary(); toast('保存しました');
  }).catch(function (e) {
    saving = false; $('save').textContent = '保存する'; summary();
    alert('保存できませんでした。もう一度押してください。\n' + (e.message || e));
  });
});
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
<script>
/* 国西Monsters 遊び心：金のネオンのバスケットボールが、ポンッと出てきて弾んで消える。
   ・ロゴを押すと、ボールがまとめて出ます
   ・端末の「動きを減らす」設定がオンのときは、自動では出ません（ロゴを押したときだけ出ます）
   ・ページのアドレスの最後に ?fun=1 を付けると、設定に関係なく自動で出て、確認メッセージも出ます */
(function () {
  var force = /[?&]fun=1/.test(location.search);
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var auto = force || !reduce;
  var G = '<path d="M50 5V95M5 50H95M19 15C37 33 37 67 19 85M81 15C63 33 63 67 81 85"/>';
  var SVG = '<svg viewBox="-12 -12 124 124" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round">' +
    '<g stroke="#ffce1f" stroke-opacity=".14" stroke-width="20"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#ffce1f" stroke-opacity=".28" stroke-width="12"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#ffce1f" stroke-width="5.2"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#fff7cf" stroke-width="1.7"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '</g></svg>';
  var D = 3900, live = 0, made = 0;
  var UP = 'cubic-bezier(.2,.65,.4,1)', DOWN = 'cubic-bezier(.6,.05,.8,.35)';

  function spawn() {
    if (document.hidden || live >= 3 || !document.body.animate) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var size = 46 + Math.random() * 36;
    var dir = Math.random() < 0.5 ? -1 : 1;
    var left = 12 + Math.random() * Math.max(10, vw - size - 24);
    var floorTop = Math.round(vh - size - vh * (0.05 + Math.random() * 0.22));
    var H = vh * (0.2 + Math.random() * 0.18);
    var dx = dir * (50 + Math.random() * 110);
    var spin = dir * (300 + Math.random() * 420);
    var el = document.createElement('div');
    el.className = 'bk';
    el.style.cssText = 'left:' + Math.round(left) + 'px;top:' + floorTop + 'px;width:' + Math.round(size) + 'px;height:' + Math.round(size) + 'px;';
    el.innerHTML = '<i class="bsh"></i><div class="bw"><div class="bs">' + SVG + '</div></div>';
    document.body.appendChild(el);
    live++; made++;
    var o = { duration: D, fill: 'forwards' };
    function hop(y, sx, sy) { return 'translateY(' + Math.round(y) + 'px) scale(' + sx + ',' + sy + ')'; }
    el.animate([
      { opacity: 0, transform: 'translateX(0px)', offset: 0 },
      { opacity: 0.88, offset: 0.04 },
      { opacity: 0.88, offset: 0.86 },
      { opacity: 0, transform: 'translateX(' + Math.round(dx) + 'px)', offset: 1 }
    ], { duration: D, fill: 'forwards', easing: 'linear' });
    el.querySelector('.bw').animate([
      { transform: hop(0, 0, 0), offset: 0, easing: 'cubic-bezier(.3,1.6,.5,1)' },
      { transform: hop(0, 1.14, .86), offset: .07, easing: UP },
      { transform: hop(-H, .96, 1.07), offset: .21, easing: DOWN },
      { transform: hop(0, 1.2, .8), offset: .34, easing: UP },
      { transform: hop(-H * .62, .97, 1.05), offset: .46, easing: DOWN },
      { transform: hop(0, 1.14, .86), offset: .57, easing: UP },
      { transform: hop(-H * .34, .98, 1.04), offset: .66, easing: DOWN },
      { transform: hop(0, 1.1, .9), offset: .74, easing: UP },
      { transform: hop(-H * .14, 1, 1), offset: .81, easing: DOWN },
      { transform: hop(0, 1.06, .94), offset: .87 },
      { transform: hop(0, .9, .9), offset: 1 }
    ], o);
    el.querySelector('.bs').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(' + Math.round(spin) + 'deg)' }], { duration: D, fill: 'forwards', easing: 'linear' });
    el.querySelector('.bsh').animate([
      { transform: 'scale(0)', opacity: 0, offset: 0 }, { transform: 'scale(1.1)', opacity: 1, offset: .07 },
      { transform: 'scale(.35)', opacity: .35, offset: .21 }, { transform: 'scale(1.15)', opacity: 1, offset: .34 },
      { transform: 'scale(.55)', opacity: .5, offset: .46 }, { transform: 'scale(1.05)', opacity: 1, offset: .57 },
      { transform: 'scale(.75)', opacity: .7, offset: .66 }, { transform: 'scale(1)', opacity: 1, offset: .74 },
      { transform: 'scale(.9)', opacity: .85, offset: .81 }, { transform: 'scale(1)', opacity: 1, offset: 1 }
    ], { duration: D, fill: 'forwards', easing: 'linear' });
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); live--; }, D + 500);
  }
  function loop() { spawn(); setTimeout(loop, 5500 + Math.random() * 5000); }
  function burst() { for (var i = 0; i < 3; i++) setTimeout(spawn, i * 260); }
  function note(text) {
    var n = document.createElement('div');
    n.style.cssText = 'position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:#0d0d0d;color:#fff;border:1px solid #ffce1f;border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.7;text-align:center;pointer-events:none';
    n.textContent = text;
    document.body.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 9000);
  }

  function start() {
    var mark = document.querySelector('.mark');
    if (mark) { mark.style.cursor = 'pointer'; mark.addEventListener('click', burst); }
    if (auto) setTimeout(loop, force ? 500 : 1400);
    if (force) {
      note('ボール確認｜動きを減らす設定：' + (reduce ? 'オン' : 'オフ') + '｜アニメーション機能：' + (document.body.animate ? '使えます' : '使えません') + '｜画面：' + window.innerWidth + '×' + window.innerHeight + '｜ロゴを押すとボールが出ます');
      setTimeout(function () { note('ボールを ' + made + ' 個出しました（見えなければ、この数字を教えてください）'); }, 3000);
    }
  }
  window.kmBall = spawn;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
