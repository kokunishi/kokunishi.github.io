<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>国西Monsters 配車希望</title>
<link rel="stylesheet" href="theme.css?v=10">
<meta name="theme-color" content="#070707">
<link rel="icon" href="mark.png">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body class="pg-ride">
<header><div class="brand"><img class="mark" src="mark.png" alt=""><div class="wm">KOKUNISHI<b>MONSTERS</b></div></div>
<h1>配車希望</h1><p>試合などの日に、車を出せるか・乗せてほしいかを入れてください</p></header>
<nav id="nav"></nav>
<main>
  <div class="card"><label for="who">お名前（保護者）を選んでください</label><select id="who" disabled><option>読み込み中…</option></select></div>
  <p class="help">係が「配車あり」にした日だけ表示されます。日ごとにボタンを押すと、その場で保存されます。<br>
  「車を出せる」の人数は、後ろに乗せられる子どもの人数です（自分の子が乗る場合も、その中の1人として数えてください）。<br>
  事情があるときはメモに書いてください（例：後発で出ます、途中ぬけます、同乗1名希望）。</p>
  <div id="list"></div>
  <p class="st" id="st"></p>
</main>
<div class="toast" id="toast"></div>
<script src="common.js"></script>
<script>
nav('ride');
var CHOICES = [['car', '車を出せる'], ['self', '自走'], ['ride', '乗せてほしい'], ['out', '不参加']];
var DATA = null, NAME = '';
try { NAME = localStorage.getItem('kokunishi_ride') || ''; } catch (e) {}

function ans(key) {
  if (!DATA.me) DATA.me = {};
  if (!DATA.me[key]) DATA.me[key] = { st: '', seats: 0, bag: false, memo: '' };
  return DATA.me[key];
}
function fillNames(names) {
  if (!names.length) { $('who').innerHTML = '<option>―</option>'; $('list').innerHTML = '<div class="msg">名簿がまだ空です</div>'; return; }
  $('who').innerHTML = '<option value="">― 選択 ―</option>' + names.map(function (n) {
    return '<option' + (n === NAME ? ' selected' : '') + '>' + esc(n) + '</option>';
  }).join('');
  $('who').disabled = false;
}

// ① 前回のデータをすぐ表示
var C = cacheGet('kokunishi_ride_cache');
if (C && C.names) {
  DATA = C; fillNames(C.names);
  if (NAME && C.meName === NAME) render(); else if (!NAME) $('list').innerHTML = '<div class="msg">まずお名前を選んでください</div>';
  if (NAME) $('st').textContent = '前回の内容を表示中…最新を確認しています';
}

// ② 最新を取得
function load(n) {
  return api({ what: 'rideinit', name: n || '' }).then(function (d) {
    DATA = d; fillNames(d.names);
    if (n && d.meName === n) render();
    else if (!n) $('list').innerHTML = '<div class="msg">まずお名前を選んでください</div>';
    else $('list').innerHTML = '<div class="msg">名簿にお名前がありません。選び直してください</div>';
    cacheSet('kokunishi_ride_cache', d);
    $('st').textContent = '最新の内容です';
  }).catch(function (e) {
    if (!DATA) $('list').innerHTML = '<div class="msg">読み込めませんでした。電波の良いところで開き直してください。<br><small>' + esc(e.message || e) + '</small></div>';
    else $('st').textContent = '最新の確認ができませんでした（前回の内容を表示中）';
  });
}
load(NAME);

$('who').addEventListener('change', function (e) {
  var n = e.target.value; if (!n) return;
  NAME = n; try { localStorage.setItem('kokunishi_ride', n); } catch (err) {}
  DATA = null; $('list').innerHTML = '<div class="msg">読み込み中…</div>';
  load(n);
});

function render() {
  if (!DATA || !DATA.meName) return;
  if (!DATA.events.length) { $('list').innerHTML = '<div class="msg">いま配車の受付中の日はありません</div>'; return; }
  var kids = (DATA.kids && DATA.kids[DATA.meName]) || [];
  var h = '';
  DATA.events.forEach(function (d, di) {
    var a = ans(d.key);
    var we = (d.w === '土' || d.w === '日' || d.hol) ? ' we' : '';
    h += '<div class="day' + we + '"><div class="dh">' + esc(d.label) + '</div><div class="pl">' +
      (d.a && d.a !== '休み' && d.a !== '応援' ? 'A：' + esc(d.a) + '<br>' : '') + (d.n && d.n !== '休み' && d.n !== '応援' ? 'NEXT：' + esc(d.n) : '') +
      (d.dep ? '<br>国西出発 ' + esc(d.dep) : '') + (d.far ? '（遠い会場）' : '') + '</div>' +
      (kids.length ? '<div class="mykids">この家のお子さん：<b>' + kids.map(esc).join('・') + '</b></div>' : '') +
      '<div class="chips">' + CHOICES.map(function (c, ci) {
        return '<button class="k' + ci + (a.st === c[0] ? ' on' : '') + '" data-d="' + di + '" data-st="' + c[0] + '">' + c[1] + '</button>';
      }).join('') + '</div>';
    if (a.st === 'car') {
      h += '<div class="sub2"><div class="lbl2">後ろに乗せられる人数（子ども）' + (a.seats ? '' : '　※選んでください') + '</div><div class="seats">' +
        [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) {
          return '<button data-d="' + di + '" data-seats="' + n + '"' + (a.seats === n ? ' class="on"' : '') + '>' + n + '</button>';
        }).join('') + '</div>' +
        '<div class="bagrow"><button data-d="' + di + '" data-bag="1" class="' + (a.bag ? 'on' : '') + '">荷物を積める' + (a.bag ? ' ✓' : '') + '</button></div></div>';
    }
    if (a.st) {
      h += '<div class="memo"><input data-d="' + di + '" value="' + esc(a.memo) + '" placeholder="メモ（任意。例：後発で出ます、途中ぬけます）"></div>';
    }
    h += '</div>';
  });
  $('list').innerHTML = h;
}
function keepCache() { cacheSet('kokunishi_ride_cache', DATA); }
function save(d) {
  var a = ans(d.key);
  keepCache();
  api({ what: 'ridesave', name: DATA.meName, key: d.key, st: a.st, seats: a.seats || 0, bag: a.bag ? '1' : '0', memo: a.memo || '' })
    .then(function () { toast('保存しました'); })
    .catch(function (e) { alert('保存できませんでした。もう一度押してください。\n' + (e.message || e)); });
}
$('list').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || !DATA) return;
  var d = DATA.events[Number(b.dataset.d)], a = ans(d.key);
  if (b.dataset.st) {
    a.st = (a.st === b.dataset.st) ? '' : b.dataset.st;
    render(); save(d);
  } else if (b.dataset.seats) {
    a.seats = Number(b.dataset.seats);
    render(); save(d);
  } else if (b.dataset.bag) {
    a.bag = !a.bag;
    render(); save(d);
  }
});
$('list').addEventListener('change', function (e) {
  if (e.target.tagName !== 'INPUT' || !DATA) return;
  var d = DATA.events[Number(e.target.dataset.d)];
  ans(d.key).memo = e.target.value; save(d);
});
</script>
<script>
/* 国西Monsters 遊び心：金のネオンのバスケットボールが、ポンッと出てきて弾んで消える。
   ・ロゴを押すと、ボールがまとめて出ます
   ・端末の「動きを減らす」設定がオンのときは、自動では出ません（ロゴを押したときだけ出ます）
   ・ページのアドレスの最後に ?fun=1 を付けると、設定に関係なく自動で出て、確認メッセージも出ます */
(function () {
  var force = /[?&]fun=1/.test(location.search);
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var auto = force || !reduce;
  var G = '<path d="M50 5V95M5 50H95M19 15C37 33 37 67 19 85M81 15C63 33 63 67 81 85"/>';
  var SVG = '<svg viewBox="-12 -12 124 124" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round">' +
    '<g stroke="#ffce1f" stroke-opacity=".14" stroke-width="20"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#ffce1f" stroke-opacity=".28" stroke-width="12"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#ffce1f" stroke-width="5.2"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '<g stroke="#fff7cf" stroke-width="1.7"><circle cx="50" cy="50" r="45"/>' + G + '</g>' +
    '</g></svg>';
  var D = 3900, live = 0, made = 0;
  var UP = 'cubic-bezier(.2,.65,.4,1)', DOWN = 'cubic-bezier(.6,.05,.8,.35)';

  function spawn() {
    if (document.hidden || live >= 3 || !document.body.animate) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var size = 46 + Math.random() * 36;
    var dir = Math.random() < 0.5 ? -1 : 1;
    var left = 12 + Math.random() * Math.max(10, vw - size - 24);
    var floorTop = Math.round(vh - size - vh * (0.05 + Math.random() * 0.22));
    var H = vh * (0.2 + Math.random() * 0.18);
    var dx = dir * (50 + Math.random() * 110);
    var spin = dir * (300 + Math.random() * 420);
    var el = document.createElement('div');
    el.className = 'bk';
    el.style.cssText = 'left:' + Math.round(left) + 'px;top:' + floorTop + 'px;width:' + Math.round(size) + 'px;height:' + Math.round(size) + 'px;';
    el.innerHTML = '<i class="bsh"></i><div class="bw"><div class="bs">' + SVG + '</div></div>';
    document.body.appendChild(el);
    live++; made++;
    var o = { duration: D, fill: 'forwards' };
    function hop(y, sx, sy) { return 'translateY(' + Math.round(y) + 'px) scale(' + sx + ',' + sy + ')'; }
    el.animate([
      { opacity: 0, transform: 'translateX(0px)', offset: 0 },
      { opacity: 0.88, offset: 0.04 },
      { opacity: 0.88, offset: 0.86 },
      { opacity: 0, transform: 'translateX(' + Math.round(dx) + 'px)', offset: 1 }
    ], { duration: D, fill: 'forwards', easing: 'linear' });
    el.querySelector('.bw').animate([
      { transform: hop(0, 0, 0), offset: 0, easing: 'cubic-bezier(.3,1.6,.5,1)' },
      { transform: hop(0, 1.14, .86), offset: .07, easing: UP },
      { transform: hop(-H, .96, 1.07), offset: .21, easing: DOWN },
      { transform: hop(0, 1.2, .8), offset: .34, easing: UP },
      { transform: hop(-H * .62, .97, 1.05), offset: .46, easing: DOWN },
      { transform: hop(0, 1.14, .86), offset: .57, easing: UP },
      { transform: hop(-H * .34, .98, 1.04), offset: .66, easing: DOWN },
      { transform: hop(0, 1.1, .9), offset: .74, easing: UP },
      { transform: hop(-H * .14, 1, 1), offset: .81, easing: DOWN },
      { transform: hop(0, 1.06, .94), offset: .87 },
      { transform: hop(0, .9, .9), offset: 1 }
    ], o);
    el.querySelector('.bs').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(' + Math.round(spin) + 'deg)' }], { duration: D, fill: 'forwards', easing: 'linear' });
    el.querySelector('.bsh').animate([
      { transform: 'scale(0)', opacity: 0, offset: 0 }, { transform: 'scale(1.1)', opacity: 1, offset: .07 },
      { transform: 'scale(.35)', opacity: .35, offset: .21 }, { transform: 'scale(1.15)', opacity: 1, offset: .34 },
      { transform: 'scale(.55)', opacity: .5, offset: .46 }, { transform: 'scale(1.05)', opacity: 1, offset: .57 },
      { transform: 'scale(.75)', opacity: .7, offset: .66 }, { transform: 'scale(1)', opacity: 1, offset: .74 },
      { transform: 'scale(.9)', opacity: .85, offset: .81 }, { transform: 'scale(1)', opacity: 1, offset: 1 }
    ], { duration: D, fill: 'forwards', easing: 'linear' });
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); live--; }, D + 500);
  }
  function loop() { spawn(); setTimeout(loop, 5500 + Math.random() * 5000); }
  function burst() { for (var i = 0; i < 3; i++) setTimeout(spawn, i * 260); }
  function note(text) {
    var n = document.createElement('div');
    n.style.cssText = 'position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:#0d0d0d;color:#fff;border:1px solid #ffce1f;border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.7;text-align:center;pointer-events:none';
    n.textContent = text;
    document.body.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 9000);
  }

  function start() {
    var mark = document.querySelector('.mark');
    if (mark) { mark.style.cursor = 'pointer'; mark.addEventListener('click', burst); }
    if (auto) setTimeout(loop, force ? 500 : 1400);
    if (force) {
      note('ボール確認｜動きを減らす設定：' + (reduce ? 'オン' : 'オフ') + '｜アニメーション機能：' + (document.body.animate ? '使えます' : '使えません') + '｜画面：' + window.innerWidth + '×' + window.innerHeight + '｜ロゴを押すとボールが出ます');
      setTimeout(function () { note('ボールを ' + made + ' 個出しました（見えなければ、この数字を教えてください）'); }, 3000);
    }
  }
  window.kmBall = spawn;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
